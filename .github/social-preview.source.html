<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'InterLocal';
    src: local('Inter'), local('SF Pro Display'), local('Helvetica Neue');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; }
  body {
    background: #0f1319;
    font-family: 'Inter', -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    color: #e8ecf2;
    display: flex;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  /* Brand glow behind the widget — echoes a desktop wallpaper without being
     a stock gradient. Purple is the logo hue (#6F46D0). */
  .glow {
    position: absolute;
    width: 900px; height: 900px;
    right: -220px; top: -180px;
    background: radial-gradient(circle at center,
      rgba(111,70,208,0.42) 0%,
      rgba(111,70,208,0.16) 38%,
      rgba(111,70,208,0) 68%);
  }
  .glow-2 {
    position: absolute;
    width: 620px; height: 620px;
    left: -260px; bottom: -300px;
    background: radial-gradient(circle at center,
      rgba(52,211,153,0.10) 0%,
      rgba(52,211,153,0) 70%);
  }

  .left {
    position: relative;
    padding: 0 0 0 76px;
    width: 610px;
    z-index: 2;
  }

  .brand {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 40px;
  }
  .brand img { width: 46px; height: 46px; border-radius: 11px; }
  .brand .name { font-size: 27px; font-weight: 700; letter-spacing: -0.4px; }
  .brand .name span { color: #9774ff; }

  h1 {
    font-size: 52px;
    line-height: 1.08;
    font-weight: 700;
    letter-spacing: -1.6px;
    margin-bottom: 22px;
  }
  h1 em { font-style: normal; color: #9774ff; }
  .nowrap { white-space: nowrap; }

  .sub {
    font-size: 22px;
    line-height: 1.45;
    color: rgba(232,236,242,0.60);
    margin-bottom: 40px;
    max-width: 470px;
  }

  .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pill {
    font-size: 15px;
    font-weight: 500;
    padding: 8px 15px;
    border-radius: 999px;
    border: 1px solid rgba(232,236,242,0.16);
    color: rgba(232,236,242,0.78);
  }
  .pill.free {
    border-color: rgba(151,116,255,0.5);
    background: rgba(151,116,255,0.13);
    color: #b9a2ff;
    font-weight: 600;
  }

  .trust {
    margin-top: 22px;
    font-size: 15px;
    letter-spacing: 0.3px;
    color: rgba(232,236,242,0.34);
  }

  /* ---- the widget itself: the signature element ---- */
  .stage {
    position: relative;
    flex: 1;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }
  .widget {
    width: 430px;
    background: #202632;
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 16px;
    padding: 40px 36px 42px;
    text-align: center;
    box-shadow:
      0 40px 90px rgba(0,0,0,0.55),
      0 8px 24px rgba(0,0,0,0.4);
  }
  .phase {
    display: inline-block;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 2.4px;
    color: #f87171;
    border: 1.5px solid rgba(248,113,113,0.55);
    border-radius: 999px;
    padding: 6px 20px;
    margin-bottom: 22px;
  }
  .clock {
    font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace;
    font-size: 96px;
    font-weight: 600;
    letter-spacing: -1px;
    line-height: 1;
    color: #dfe6ef;
    font-variant-numeric: tabular-nums;
  }
  .clock .colon { color: rgba(223,230,239,0.45); margin: 0 2px; }
  .task {
    margin-top: 20px;
    font-size: 23px;
    color: rgba(223,230,239,0.62);
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow-2"></div>

  <div class="left">
    <div class="brand">
      <img src="file:///Users/amu1o5/personal/focusdoro/public/images/logo.png" alt="">
      <div class="name">Focusdoro <span>Widget</span></div>
    </div>

    <h1>Keep the timer <em class="nowrap">on&nbsp;top</em><br>of your work.</h1>

    <p class="sub">
      A desktop Pomodoro companion that shows the countdown
      <em style="color:rgba(232,236,242,0.85);font-style:normal">and the task</em> —
      always visible, never in a browser tab.
    </p>

    <div class="meta">
      <span class="pill free">Free · no signup</span>
      <span class="pill">macOS</span>
      <span class="pill">Windows</span>
      <span class="pill">Linux</span>
    </div>
    <div class="trust">Signed &amp; notarized &nbsp;·&nbsp; Apple Developer ID</div>
  </div>

  <div class="stage">
    <div class="widget">
      <div class="phase">FOCUS</div>
      <div class="clock">29<span class="colon">:</span>12</div>
      <div class="task">Optimus Fixes</div>
    </div>
  </div>
</body>
</html>
